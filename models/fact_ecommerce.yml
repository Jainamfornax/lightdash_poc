version: 2

models:
  - name: fact_ecommerce
    description: >
      Core e-commerce fact table for a D2C nutrition/protein brand selling across Amazon and Shopify.
      Each row is a single order line item (one product per row). Orders can have 1-4 line items.
      Use order_id to aggregate at order level, customer_id for customer-level analysis.
      Supports revenue analytics, campaign ROI, customer lifecycle, product performance, and marketing attribution.

    meta:
      label: "E-Commerce Analytics"

      metrics:

        # ─── REVENUE ─────────────────────────────────
        total_revenue:
          type: sum
          sql: ${line_total}
          label: "Total Revenue"
          description: "Sum of all line totals after discounts. Primary topline metric."
          format: usd
          round: 1

        cy_revenue:
          type: sum
          sql: "CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_total} ELSE 0 END"
          label: "CY YTD Revenue"
          description: "Current year (2026) revenue through April, for like-for-like YoY comparison with PY YTD."
          format: usd
          round: 1

        py_ytd_revenue:
          type: sum
          sql: "CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_total} ELSE 0 END"
          label: "PY YTD Revenue"
          description: "Previous year revenue through the same month, for like-for-like YoY comparison."
          format: usd
          round: 1

        revenue_yoy_growth_pct:
          type: number
          sql: "SAFE_DIVIDE((${cy_revenue} - ${py_ytd_revenue}), ${py_ytd_revenue})"
          label: "Revenue YoY Growth %"
          description: "Year-over-year revenue growth rate. Positive means the business is growing."
          format: percent
          round: 1

        # ─── PROFIT & MARGIN ─────────────────────────
        total_profit:
          type: sum
          sql: ${line_gross_profit}
          label: "Total Gross Profit"
          description: "Revenue minus cost of goods sold. Shows how much money the business actually keeps."
          format: usd
          round: 1

        cy_profit:
          type: sum
          sql: "CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_gross_profit} ELSE 0 END"
          label: "CY YTD Profit"
          description: "Current year (2026) gross profit through April, for like-for-like YoY comparison."
          format: usd
          round: 1

        py_ytd_profit:
          type: sum
          sql: "CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_gross_profit} ELSE 0 END"
          label: "PY YTD Profit"
          description: "Previous year profit through the same month."
          format: usd
          round: 1

        profit_margin_pct:
          type: number
          sql: "SAFE_DIVIDE(${total_profit}, ${total_revenue})"
          label: "Gross Margin %"
          description: "Percentage of revenue retained as profit after COGS. Higher is better — target is above 45%."
          format: percent
          round: 1

        cy_margin_pct:
          type: number
          sql: "SAFE_DIVIDE(${cy_profit}, NULLIF(${cy_revenue}, 0))"
          label: "CY YTD Margin %"
          description: "Current year YTD gross margin for like-for-like comparison with previous year."
          format: percent
          round: 1

        py_ytd_margin_pct:
          type: number
          sql: "SAFE_DIVIDE(${py_ytd_profit}, NULLIF(${py_ytd_revenue}, 0))"
          label: "PY YTD Margin %"
          description: "Previous year YTD gross margin for like-for-like comparison."
          format: percent
          round: 1

        total_cogs:
          type: sum
          sql: ${line_cogs}
          label: "Total COGS"
          description: "Total cost of goods sold. Rising COGS with flat margin signals pricing power."
          format: usd
          round: 1

        # ─── CY/PY DISCOUNT METRICS ─────────────────
        cy_discount_rate:
          type: number
          sql: "SAFE_DIVIDE(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_discount} ELSE 0 END), NULLIF(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_subtotal} ELSE 0 END), 0))"
          label: "CY YTD Discount Rate"
          description: "Current year YTD effective discount rate."
          format: percent
          round: 1

        py_ytd_discount_rate:
          type: number
          sql: "SAFE_DIVIDE(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_discount} ELSE 0 END), NULLIF(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_subtotal} ELSE 0 END), 0))"
          label: "PY YTD Discount Rate"
          description: "Previous year YTD effective discount rate."
          format: percent
          round: 1

        cy_pct_orders_discounted:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${discount_pct} > 0 THEN ${order_id} END), COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END))"
          label: "CY YTD % Orders Discounted"
          description: "Current year YTD share of orders that received any discount."
          format: percent
          round: 1

        py_ytd_pct_orders_discounted:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${discount_pct} > 0 THEN ${order_id} END), COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END))"
          label: "PY YTD % Orders Discounted"
          description: "Previous year YTD share of orders that received any discount."
          format: percent
          round: 1

        # ─── CY/PY CAMPAIGN NET ROI ─────────────────
        cy_campaign_net_roi:
          type: number
          sql: "SAFE_DIVIDE((SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_gross_profit} ELSE 0 END) - SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${ad_spend_allocated} ELSE 0 END)), NULLIF(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${ad_spend_allocated} ELSE 0 END), 0))"
          label: "CY YTD Campaign Net ROI"
          description: "Current year YTD net return on marketing: (profit - ad spend) / ad spend. Above 1.0 = profitable."
          round: 2

        py_ytd_campaign_net_roi:
          type: number
          sql: "SAFE_DIVIDE((SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_gross_profit} ELSE 0 END) - SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${ad_spend_allocated} ELSE 0 END)), NULLIF(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${ad_spend_allocated} ELSE 0 END), 0))"
          label: "PY YTD Campaign Net ROI"
          description: "Previous year YTD net return on marketing. Compare with CY to track marketing efficiency."
          round: 2

        # ─── ORDERS & AOV ────────────────────────────
        total_orders:
          type: count_distinct
          sql: ${order_id}
          label: "Total Orders"
          description: "Count of unique orders. One order can contain multiple products."

        cy_orders:
          type: count_distinct
          sql: "CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END"
          label: "CY YTD Orders"
          description: "Current year YTD order count for like-for-like comparison."

        py_ytd_orders:
          type: count_distinct
          sql: "CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END"
          label: "PY YTD Orders"
          description: "Previous year YTD order count for like-for-like comparison."

        avg_order_value:
          type: number
          sql: "SAFE_DIVIDE(${total_revenue}, ${total_orders})"
          label: "AOV"
          description: "Average order value — total revenue divided by number of orders. Key health metric for D2C."
          format: usd
          round: 1

        cy_aov:
          type: number
          sql: "SAFE_DIVIDE(${cy_revenue}, COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END))"
          label: "CY YTD AOV"
          description: "Current year YTD average order value for like-for-like YoY comparison."
          format: usd
          round: 1

        py_ytd_aov:
          type: number
          sql: "SAFE_DIVIDE(${py_ytd_revenue}, COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END))"
          label: "PY YTD AOV"
          description: "Previous year YTD average order value."
          format: usd
          round: 1

        aov_growth_yoy:
          type: number
          sql: "SAFE_DIVIDE((${cy_aov} - ${py_ytd_aov}), ${py_ytd_aov})"
          label: "AOV Growth YoY %"
          description: "Are customers spending more per order this year vs last?"
          format: percent
          round: 1

        total_units_sold:
          type: sum
          sql: ${quantity}
          label: "Total Units Sold"
          description: "Total product units sold across all orders."
          round: 0

        avg_units_per_order:
          type: number
          sql: "SAFE_DIVIDE(${total_units_sold}, ${total_orders})"
          label: "Avg Units per Order"
          description: "Average basket size in units. Higher means better cross-sell."
          round: 1

        # ─── CUSTOMERS & LIFECYCLE ───────────────────
        unique_customers:
          type: count_distinct
          sql: ${customer_id}
          label: "Unique Customers"
          description: "Total distinct customers who placed at least one order."

        first_time_customers:
          type: count_distinct
          sql: "CASE WHEN ${is_first_time_customer} = TRUE THEN ${customer_id} END"
          label: "New Customers"
          description: "Customers making their first ever purchase. This is the acquisition funnel output."

        returning_customers:
          type: count_distinct
          sql: "CASE WHEN ${is_first_time_customer} = FALSE THEN ${customer_id} END"
          label: "Returning Customers"
          description: "Customers who have purchased before. Returning customers are cheaper to serve and spend more."

        repeat_purchase_rate:
          type: number
          sql: "SAFE_DIVIDE(${returning_customers}, ${unique_customers})"
          label: "Repeat Purchase Rate"
          description: "What percentage of customers come back to buy again? Above 40% is strong for D2C."
          format: percent
          round: 1

        pct_new_customer_orders:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN ${is_first_time_customer} = TRUE THEN ${order_id} END), ${total_orders})"
          label: "% Orders from New Customers"
          description: "Share of orders from first-time buyers. High means growth-mode, low means loyalty-mode."
          format: percent
          round: 1

        aov_new_customers:
          type: number
          sql: "SAFE_DIVIDE(SUM(CASE WHEN ${is_first_time_customer} = TRUE THEN ${line_total} ELSE 0 END), COUNT(DISTINCT CASE WHEN ${is_first_time_customer} = TRUE THEN ${order_id} END))"
          label: "AOV - New Customers"
          description: "Average order value for first-time buyers. Compare with returning AOV to measure loyalty uplift."
          format: usd
          round: 1

        aov_returning_customers:
          type: number
          sql: "SAFE_DIVIDE(SUM(CASE WHEN ${is_first_time_customer} = FALSE THEN ${line_total} ELSE 0 END), COUNT(DISTINCT CASE WHEN ${is_first_time_customer} = FALSE THEN ${order_id} END))"
          label: "AOV - Returning Customers"
          description: "Average order value for repeat buyers. Should be higher than new customer AOV."
          format: usd
          round: 1

        aov_uplift_new_vs_returning:
          type: number
          sql: "SAFE_DIVIDE((${aov_returning_customers} - ${aov_new_customers}), ${aov_new_customers})"
          label: "AOV Uplift (Returning vs New)"
          description: "How much more do returning customers spend per order compared to new ones? Positive = loyalty is working."
          format: percent
          round: 1

        avg_purchase_frequency:
          type: number
          sql: "SAFE_DIVIDE(${total_orders}, ${unique_customers})"
          label: "Avg Purchase Frequency"
          description: "Average number of orders per customer. Higher means stronger retention."
          round: 2

        avg_customer_ltv:
          type: average
          sql: ${customer_lifetime_value}
          label: "Avg Customer LTV"
          description: "Average lifetime value across all customers. VIP customers are above $400. Use to assess long-term customer worth."
          format: usd
          round: 0

        # ─── CY/PY CUSTOMER TYPE METRICS (for Section 2 charts) ───
        cy_new_customers:
          type: count_distinct
          sql: "CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${is_first_time_customer} = TRUE THEN ${customer_id} END"
          label: "CY YTD New Customers"
          description: "New customers acquired in current year YTD."

        py_ytd_new_customers:
          type: count_distinct
          sql: "CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${is_first_time_customer} = TRUE THEN ${customer_id} END"
          label: "PY YTD New Customers"
          description: "New customers acquired in previous year YTD. Compare with CY to track acquisition growth."

        cy_returning_customers:
          type: count_distinct
          sql: "CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${is_first_time_customer} = FALSE THEN ${customer_id} END"
          label: "CY YTD Returning Customers"
          description: "Returning customers in current year YTD."

        py_ytd_returning_customers:
          type: count_distinct
          sql: "CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${is_first_time_customer} = FALSE THEN ${customer_id} END"
          label: "PY YTD Returning Customers"
          description: "Returning customers in previous year YTD. Compare with CY to track retention growth."

        cy_new_customer_revenue:
          type: sum
          sql: "CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${is_first_time_customer} = TRUE THEN ${line_total} ELSE 0 END"
          label: "CY YTD New Customer Revenue"
          description: "Revenue from first-time buyers in current year YTD."
          format: usd
          round: 1

        py_ytd_new_customer_revenue:
          type: sum
          sql: "CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${is_first_time_customer} = TRUE THEN ${line_total} ELSE 0 END"
          label: "PY YTD New Customer Revenue"
          description: "Revenue from first-time buyers in previous year YTD."
          format: usd
          round: 1

        cy_returning_customer_revenue:
          type: sum
          sql: "CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${is_first_time_customer} = FALSE THEN ${line_total} ELSE 0 END"
          label: "CY YTD Returning Customer Revenue"
          description: "Revenue from repeat buyers in current year YTD. Growing faster than new = loyalty flywheel working."
          format: usd
          round: 1

        py_ytd_returning_customer_revenue:
          type: sum
          sql: "CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${is_first_time_customer} = FALSE THEN ${line_total} ELSE 0 END"
          label: "PY YTD Returning Customer Revenue"
          description: "Revenue from repeat buyers in previous year YTD."
          format: usd
          round: 1

        # ─── SESSIONS & CONVERSION ───────────────────
        total_sessions:
          type: count_distinct
          sql: ${session_id}
          label: "Total Sessions"
          description: "Unique browsing sessions that resulted in an order."

        orders_per_session:
          type: number
          sql: "SAFE_DIVIDE(${total_orders}, ${total_sessions})"
          label: "Orders per Session"
          description: "Conversion efficiency — how many sessions turn into orders."
          round: 2

        # ─── MARKETING & ROAS ────────────────────────
        total_ad_spend:
          type: sum
          sql: ${ad_spend_allocated}
          label: "Total Ad Spend"
          description: "Total marketing spend allocated across paid channels. Zero for organic traffic."
          format: usd
          round: 1

        blended_roas:
          type: number
          sql: "SAFE_DIVIDE(${total_revenue}, NULLIF(${total_ad_spend}, 0))"
          label: "Blended ROAS"
          description: "Return on ad spend — total revenue divided by total ad spend. Above 3x is healthy for D2C."
          round: 1

        cy_roas:
          type: number
          sql: "SAFE_DIVIDE(${cy_revenue}, NULLIF(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${ad_spend_allocated} ELSE 0 END), 0))"
          label: "CY YTD ROAS"
          description: "Current year YTD ROAS for like-for-like marketing efficiency comparison."
          round: 1

        py_ytd_roas:
          type: number
          sql: "SAFE_DIVIDE(${py_ytd_revenue}, NULLIF(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${ad_spend_allocated} ELSE 0 END), 0))"
          label: "PY YTD ROAS"
          description: "Previous year YTD ROAS for like-for-like marketing efficiency comparison."
          round: 1

        cac_first_time:
          type: number
          sql: "SAFE_DIVIDE(SUM(CASE WHEN ${is_first_time_customer} = TRUE THEN ${ad_spend_allocated} ELSE 0 END), COUNT(DISTINCT CASE WHEN ${is_first_time_customer} = TRUE THEN ${customer_id} END))"
          label: "Customer Acquisition Cost"
          description: "Average cost to acquire a new customer. Compare with LTV to assess sustainability."
          format: usd
          round: 1

        # ─── DISCOUNTS ───────────────────────────────
        total_discount_amount:
          type: sum
          sql: ${line_discount}
          label: "Total Discount Given"
          description: "Total discount amount across all orders. Watch this relative to revenue — leaking margin?"
          format: usd
          round: 1

        avg_discount_pct:
          type: number
          sql: "SAFE_DIVIDE(SUM(${line_discount}), NULLIF(SUM(${line_subtotal}), 0))"
          label: "Avg Discount Rate"
          description: "Effective discount rate across all orders. Campaign periods will spike this."
          format: percent
          round: 1

        pct_orders_discounted:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN ${discount_pct} > 0 THEN ${order_id} END), ${total_orders})"
          label: "% Orders with Discount"
          description: "What share of orders used a discount? Rising trend means growing discount dependency."
          format: percent
          round: 1

        # ─── PRODUCT ANALYTICS ───────────────────────
        product_revenue_contribution_pct:
          type: number
          sql: "SAFE_DIVIDE(SUM(${line_total}), SUM(SUM(${line_total})) OVER ())"
          label: "Revenue Contribution %"
          description: "What percentage of total revenue does this product/category contribute?"
          format: percent
          round: 1

        total_first_time_orders:
          type: count_distinct
          sql: "CASE WHEN ${is_first_time_customer} = TRUE THEN ${order_id} END"
          label: "First Time Orders"
          description: "Orders from brand-new customers. Shows which products attract new buyers (entry products)."

        repeat_purchase_rate_per_product:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN ${is_first_time_customer} = FALSE THEN ${customer_id} END), COUNT(DISTINCT ${customer_id}))"
          label: "Repeat Rate per Product"
          description: "What % of customers who buy this product come back? High repeat = sticky product."
          format: percent
          round: 1

        avg_discount_pct_per_product:
          type: average
          sql: "${discount_pct} / 100"
          label: "Avg Discount % per Product"
          description: "Average discount applied to this product. Are we over-discounting certain SKUs?"
          format: percent
          round: 1

        # ─── CAMPAIGN PERFORMANCE ────────────────────
        campaign_revenue:
          type: sum
          sql: ${line_total}
          label: "Campaign Revenue"
          description: "Revenue broken down by campaign. Use with the campaign dimension to compare Black Friday vs Prime Day vs Easter."
          format: usd
          round: 1

        campaign_orders:
          type: count_distinct
          sql: ${order_id}
          label: "Campaign Orders"
          description: "Number of orders per campaign. Combine with discount and profit to calculate campaign ROI."

        campaign_profit:
          type: sum
          sql: ${line_gross_profit}
          label: "Campaign Profit"
          description: "Gross profit per campaign. The real measure of campaign success — revenue minus COGS."
          format: usd
          round: 1

        campaign_ad_spend:
          type: sum
          sql: ${ad_spend_allocated}
          label: "Campaign Ad Spend"
          description: "Marketing spend per campaign. Use with campaign_profit to calculate true ROI."
          format: usd
          round: 1

        ad_spend_per_order:
          type: number
          sql: "SAFE_DIVIDE(${total_ad_spend}, ${total_orders})"
          label: "Ad Spend per Order"
          description: "Average marketing cost per order. Use with campaign dimension to compare acquisition cost across campaigns."
          format: usd
          round: 0

        campaign_net_roi:
          type: number
          sql: "SAFE_DIVIDE((${total_profit} - ${total_ad_spend}), NULLIF(${total_ad_spend}, 0))"
          label: "Campaign Net ROI"
          description: "Net return on marketing investment: (profit - ad spend) / ad spend. Above 1.0 means the campaign is profitable."
          round: 2

        # ─── PAYMENT METHOD ──────────────────────────
        cod_orders:
          type: count_distinct
          sql: "CASE WHEN ${payment_method} = 'COD' THEN ${order_id} END"
          label: "COD Orders"
          description: "Cash-on-delivery orders. Higher COD share increases operational cost and return risk."

        online_orders:
          type: count_distinct
          sql: "CASE WHEN ${payment_method} = 'Online' THEN ${order_id} END"
          label: "Online Payment Orders"
          description: "Prepaid online orders. Preferred — lower return rate and better cash flow."

        cod_share:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN ${payment_method} = 'COD' THEN ${order_id} END), ${total_orders})"
          label: "COD Share %"
          description: "Percentage of orders paid via COD. D2C brands aim to reduce this below 30%."
          format: percent
          round: 1

        # ─── SECTION 4: CHANNEL & TRAFFIC (CY vs PY) ──

        # Amazon Revenue Share %
        cy_amazon_revenue_share:
          type: number
          sql: "SAFE_DIVIDE(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${channel} = 'Amazon' THEN ${line_total} ELSE 0 END), NULLIF(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_total} ELSE 0 END), 0))"
          label: "CY Amazon Revenue Share %"
          description: "Percentage of CY YTD revenue from Amazon channel."
          format: percent
          round: 1

        py_ytd_amazon_revenue_share:
          type: number
          sql: "SAFE_DIVIDE(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${channel} = 'Amazon' THEN ${line_total} ELSE 0 END), NULLIF(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_total} ELSE 0 END), 0))"
          label: "PY Amazon Revenue Share %"
          description: "Percentage of PY YTD revenue from Amazon channel."
          format: percent
          round: 1

        # Shopify Revenue Share %
        cy_shopify_revenue_share:
          type: number
          sql: "SAFE_DIVIDE(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${channel} = 'Shopify' THEN ${line_total} ELSE 0 END), NULLIF(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_total} ELSE 0 END), 0))"
          label: "CY Shopify Revenue Share %"
          description: "Percentage of CY YTD revenue from Shopify channel."
          format: percent
          round: 1

        py_ytd_shopify_revenue_share:
          type: number
          sql: "SAFE_DIVIDE(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${channel} = 'Shopify' THEN ${line_total} ELSE 0 END), NULLIF(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_total} ELSE 0 END), 0))"
          label: "PY Shopify Revenue Share %"
          description: "Percentage of PY YTD revenue from Shopify channel."
          format: percent
          round: 1

        # Organic Traffic %
        cy_organic_traffic_pct:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${source} = 'organic' THEN ${order_id} END), COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END))"
          label: "CY Organic Traffic %"
          description: "Percentage of CY YTD orders from organic (non-paid) traffic."
          format: percent
          round: 1

        py_ytd_organic_traffic_pct:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${source} = 'organic' THEN ${order_id} END), COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END))"
          label: "PY Organic Traffic %"
          description: "Percentage of PY YTD orders from organic (non-paid) traffic."
          format: percent
          round: 1

        # COD Share % (CY vs PY)
        cy_cod_share:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${payment_method} = 'COD' THEN ${order_id} END), COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END))"
          label: "CY COD Share %"
          description: "Percentage of CY YTD orders paid via COD. Lower = more trust."
          format: percent
          round: 1

        py_ytd_cod_share:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${payment_method} = 'COD' THEN ${order_id} END), COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END))"
          label: "PY COD Share %"
          description: "Percentage of PY YTD orders paid via COD."
          format: percent
          round: 1

        # Mobile Revenue Share %
        cy_mobile_revenue_share:
          type: number
          sql: "SAFE_DIVIDE(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${device} = 'mobile' THEN ${line_total} ELSE 0 END), NULLIF(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_total} ELSE 0 END), 0))"
          label: "CY Mobile Revenue Share %"
          description: "Percentage of CY YTD revenue from mobile devices."
          format: percent
          round: 1

        py_ytd_mobile_revenue_share:
          type: number
          sql: "SAFE_DIVIDE(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${device} = 'mobile' THEN ${line_total} ELSE 0 END), NULLIF(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_total} ELSE 0 END), 0))"
          label: "PY Mobile Revenue Share %"
          description: "Percentage of PY YTD revenue from mobile devices."
          format: percent
          round: 1

        # ─── SECTION 2: PURCHASE FREQUENCY ─────────────

        # Avg Orders per Customer
        cy_avg_orders_per_customer:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END), NULLIF(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${customer_id} END), 0))"
          label: "CY Avg Orders per Customer"
          description: "Average number of orders per unique customer in CY YTD. Higher = stronger repeat behavior."
          round: 2

        py_ytd_avg_orders_per_customer:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END), NULLIF(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${customer_id} END), 0))"
          label: "PY Avg Orders per Customer"
          description: "Average number of orders per unique customer in PY YTD."
          round: 2

        # ─── SECTION 5: PRODUCT & CATALOG ─────────────

        # Avg Items per Order
        cy_avg_items_per_order:
          type: number
          sql: "SAFE_DIVIDE(COUNT(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_line_id} END), NULLIF(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END), 0))"
          label: "CY Avg Items per Order"
          description: "Average number of products per order in CY YTD. Higher = better cross-sell."
          round: 2

        py_ytd_avg_items_per_order:
          type: number
          sql: "SAFE_DIVIDE(COUNT(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_line_id} END), NULLIF(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END), 0))"
          label: "PY Avg Items per Order"
          description: "Average number of products per order in PY YTD."
          round: 2

        # Powder Revenue Share % (top category concentration)
        cy_top_category_share:
          type: number
          sql: "SAFE_DIVIDE(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${category} = 'Powder' THEN ${line_total} ELSE 0 END), NULLIF(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_total} ELSE 0 END), 0))"
          label: "CY Powder Revenue Share %"
          description: "Percentage of CY YTD revenue from Powder category. Measures catalog concentration risk."
          format: percent
          round: 1

        py_ytd_top_category_share:
          type: number
          sql: "SAFE_DIVIDE(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${category} = 'Powder' THEN ${line_total} ELSE 0 END), NULLIF(SUM(CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${line_total} ELSE 0 END), 0))"
          label: "PY Powder Revenue Share %"
          description: "Percentage of PY YTD revenue from Powder category."
          format: percent
          round: 1

        # Bundle Attach Rate % (orders with 2+ categories)
        cy_bundle_attach_rate:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${basket_size} >= 2 THEN ${order_id} END), NULLIF(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END), 0))"
          label: "CY Bundle Attach Rate %"
          description: "Percentage of CY YTD orders with 2+ products. Higher = better cross-sell."
          format: percent
          round: 1

        py_ytd_bundle_attach_rate:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 AND ${basket_size} >= 2 THEN ${order_id} END), NULLIF(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${order_id} END), 0))"
          label: "PY Bundle Attach Rate %"
          description: "Percentage of PY YTD orders with 2+ products."
          format: percent
          round: 1

        # Avg Categories per Customer
        cy_avg_categories_per_customer:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN CONCAT(${customer_id}, '-', ${category}) END), NULLIF(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2026 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${customer_id} END), 0))"
          label: "CY Avg Categories per Customer"
          description: "Average number of distinct categories each customer buys in CY YTD. Higher = better catalog exploration."
          round: 2

        py_ytd_avg_categories_per_customer:
          type: number
          sql: "SAFE_DIVIDE(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN CONCAT(${customer_id}, '-', ${category}) END), NULLIF(COUNT(DISTINCT CASE WHEN EXTRACT(YEAR FROM ${order_date}) = 2025 AND EXTRACT(MONTH FROM ${order_date}) <= 4 THEN ${customer_id} END), 0))"
          label: "PY Avg Categories per Customer"
          description: "Average number of distinct categories each customer buys in PY YTD."
          round: 2

    columns:
      # ─── ORDER IDENTIFIERS ─────────────────────────
      - name: order_id
        description: "Unique order identifier. One order can contain multiple line items (products)."
        meta:
          dimension:
            type: string

      - name: order_line_id
        description: "Line item number within an order (1, 2, 3, etc.)"
        meta:
          dimension:
            type: number

      - name: customer_id
        description: "Unique customer identifier for tracking lifecycle and repeat behavior."
        meta:
          dimension:
            type: string

      # ─── DATE DIMENSIONS ───────────────────────────
      - name: order_date
        description: "Date the order was placed. Primary time dimension for all trend analysis."
        meta:
          dimension:
            type: date
            time_intervals: [DAY, WEEK, MONTH, QUARTER, YEAR]

      - name: order_year
        description: "Year extracted from order date (2025 or 2026). Use as series/group-by to overlay CY vs PY trends."
        meta:
          dimension:
            type: string
            sql: "CAST(EXTRACT(YEAR FROM ${TABLE}.order_date) AS STRING)"

      - name: order_month_number
        description: "Month number (1-12) extracted from order date. Use on X-axis with order_year as series for CY vs PY overlay charts."
        meta:
          dimension:
            type: number
            sql: "EXTRACT(MONTH FROM ${TABLE}.order_date)"

      - name: order_month_name
        description: "Month name (Jan, Feb, etc). Use as X-axis label for CY vs PY overlay."
        meta:
          dimension:
            type: string
            sql: "FORMAT_DATE('%b', ${TABLE}.order_date)"

      - name: created_at
        description: "Order creation timestamp (same as order_date in this dataset)."
        meta:
          dimension:
            type: date

      # ─── PRODUCT DIMENSIONS ────────────────────────
      - name: product_id
        description: "Unique product SKU identifier (P001 through P010)."
        meta:
          dimension:
            type: string

      - name: product_name
        description: "Human-readable product name. 10 products across 6 categories."
        meta:
          dimension:
            type: string

      - name: category
        description: "Product category: Powder, Butter, Chips, Bars, Kits, or Drinks. Use for category-level revenue and margin analysis."
        meta:
          dimension:
            type: string

      - name: quantity
        description: "Number of units of this product in this order line."
        meta:
          dimension:
            type: number

      # ─── FINANCIAL DIMENSIONS ──────────────────────
      - name: unit_price
        description: "Price per unit before any discount. Range: $12 (Chips) to $89 (Mega Combo Box)."
        meta:
          dimension:
            type: number
            format: usd

      - name: line_subtotal
        description: "Quantity x unit price, before discount applied."
        meta:
          dimension:
            type: number
            format: usd

      - name: discount_pct
        description: "Discount percentage applied (0-25%). Varies by campaign: Black Friday up to 25%, organic usually 0%."
        meta:
          dimension:
            type: number

      - name: line_discount
        description: "Dollar amount of discount on this line item."
        meta:
          dimension:
            type: number
            format: usd

      - name: line_total
        description: "Final price paid for this line item after discount. This is the revenue number."
        meta:
          dimension:
            type: number
            format: usd

      - name: cogs_per_unit
        description: "Cost of goods sold per unit. Used to calculate gross profit and margin."
        meta:
          dimension:
            type: number
            format: usd

      - name: line_cogs
        description: "Total COGS for this line item (quantity x cogs_per_unit)."
        meta:
          dimension:
            type: number
            format: usd

      - name: line_gross_profit
        description: "Gross profit on this line: line_total minus line_cogs. Negative means selling at a loss."
        meta:
          dimension:
            type: number
            format: usd

      - name: ad_spend_allocated
        description: "Marketing spend attributed to this line item. Zero for organic traffic."
        meta:
          dimension:
            type: number
            format: usd

      # ─── MARKETING DIMENSIONS ──────────────────────
      - name: campaign
        description: "Marketing campaign that drove this order. Values: organic (no campaign), first_time_customer (new buyer discount), black_friday (Nov sale), easter_special (spring sale), big_billion_days (Oct sale), prime_day (Jul sale)."
        meta:
          dimension:
            type: string

      - name: channel
        description: "Sales channel where the order was placed: Amazon or Shopify. Amazon is the primary channel (~58%)."
        meta:
          dimension:
            type: string

      - name: source
        description: "Traffic source that brought the customer: organic (free), paid_search (Google/Amazon ads), or paid_social (Meta/Instagram ads)."
        meta:
          dimension:
            type: string

      - name: device
        description: "Device used to place the order: mobile (52%), desktop (35%), or tablet (13%)."
        meta:
          dimension:
            type: string

      - name: session_id
        description: "Unique browsing session identifier. One session = one order in this dataset."
        meta:
          dimension:
            type: string

      # ─── CUSTOMER DIMENSIONS ───────────────────────
      - name: is_first_time_customer
        description: "TRUE if this is the customer's very first order, FALSE if they've bought before. Key dimension for new vs returning analysis."
        meta:
          dimension:
            type: boolean

      - name: cohort
        description: "Customer acquisition cohort in YYYY-MM format (month of first purchase). Use for cohort retention analysis."
        meta:
          dimension:
            type: string

      - name: days_since_first
        description: "Days between customer's first ever order and this order. 0 for first-time customers."
        meta:
          dimension:
            type: number

      - name: days_since_last_order
        description: "Days between this order and the customer's previous order. 0 for first-time customers. Reveals the natural reorder cycle."
        meta:
          dimension:
            type: number
          additional_dimensions:
            reorder_window:
              type: string
              sql: "CASE WHEN ${days_since_last_order} = 0 THEN 'First Purchase' WHEN ${days_since_last_order} BETWEEN 1 AND 30 THEN '1-30 days' WHEN ${days_since_last_order} BETWEEN 31 AND 60 THEN '31-60 days' WHEN ${days_since_last_order} BETWEEN 61 AND 90 THEN '61-90 days' ELSE '90+ days' END"
              label: "Reorder Window"
              description: "How quickly customers reorder after their last purchase: 1-30, 31-60, 61-90, or 90+ days. Filter out First Purchase to see repeat behavior."

      - name: customer_lifetime_value
        description: "Total historical spend by this customer across all orders. VIP customers have LTV above $400."
        meta:
          dimension:
            type: number
            format: usd

      # ─── BASKET ──────────────────────────────────────
      - name: basket_size
        description: "Number of distinct products in this order (1-4). Use for items-per-order distribution charts."
        meta:
          dimension:
            type: number
            label: "Basket Size"
          additional_dimensions:
            basket_bucket:
              type: string
              sql: "CASE WHEN ${TABLE}.basket_size = 1 THEN '1 item' WHEN ${TABLE}.basket_size = 2 THEN '2 items' WHEN ${TABLE}.basket_size = 3 THEN '3 items' ELSE '4+ items' END"
              label: "Basket Bucket"
              description: "Basket size grouped: 1 item, 2 items, 3 items, 4+ items. Use on X-axis for distribution chart."

      # ─── PAYMENT ───────────────────────────────────
      - name: payment_method
        description: "How the customer paid: Online (prepaid — credit card, UPI, net banking) or COD (cash on delivery). COD has higher return rates and operational cost."
        meta:
          dimension:
            type: string
